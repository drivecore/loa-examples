name: Examples
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * 1"
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run assets:resolve -- --mode remote
      - run: npm run assets:pull
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: threejs-examples
          path: dist/
